<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#234d2c" />
  <title>Rupali's Jurassic World</title>
  <link rel="preload" as="image" href="assets/landing.webp" />
  <link rel="preload" as="image" href="assets/explore.webp" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" aria-live="polite">
    <!-- LANDING -->
    <section id="landing" class="scene scene--active scene--landing" aria-label="Landing page">
      <div class="scene-bg scene-bg--landing" data-parallax-bg></div>
      <div class="ambient ambient--landing" aria-hidden="true"></div>

      <div class="landing-hotspots" aria-label="Choose how you want to begin">
        <button class="hotspot hotspot--love" data-action="love" aria-label="I lovee you yesss"></button>
        <button class="hotspot hotspot--hate" data-action="hate" aria-label="I hate you but okay"></button>
      </div>

      <div class="mobile-choice" aria-label="Choose how you want to begin">
        <p>Ready to go your world?</p>
        <div class="mobile-choice__buttons">
          <button class="pill pill--pink" data-action="love">I lovee you yesss</button>
          <button class="pill pill--green" data-action="hate">I hate you but okay</button>
        </div>
      </div>

      <div class="scroll-cue" aria-hidden="true">
        <span class="scroll-cue__mouse"></span>
        <span>Move around to explore</span>
      </div>
    </section>

    <!-- START / RESPONSE MODAL -->
    <div id="responseModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="responseText" hidden>
      <div class="modal__scrim"></div>
      <div class="modal__panel">
        <div class="modal__heart" aria-hidden="true">♥</div>
        <p id="responseText" class="modal__text">Let's go :))</p>
        <button id="responseButton" class="modal__button">Let's go :))</button>
      </div>
    </div>

    <!-- EXPLORATION -->
    <section id="explore" class="scene scene--explore" aria-label="Choose a dinosaur world" hidden>
      <div class="scene-bg scene-bg--explore" data-parallax-bg></div>
      <div class="scene-vignette" aria-hidden="true"></div>
      <button class="round-back" data-back="landing" aria-label="Go back to the previous page">←</button>

      <div class="dino-hotspots" aria-label="Choose a dinosaur world">
        <button class="dino-hotspot dino-hotspot--love" data-world="love" aria-label="Explore Dinosaur of Love's World">
          <span>Explore this world</span>
        </button>
        <button class="dino-hotspot dino-hotspot--apology" data-world="apology" aria-label="Explore Dinosaur of Apology's World">
          <span>Explore this world</span>
        </button>
        <button class="dino-hotspot dino-hotspot--promises" data-world="promises" aria-label="Explore Dinosaur of Promises' World">
          <span>Explore this world</span>
        </button>
      </div>

      <div class="mobile-world-list">
        <h1>Choose a dinosaur world</h1>
        <button data-world="love">💗 Dinosaur of Love's World</button>
        <button data-world="apology">🧡 Dinosaur of Apology's World</button>
        <button data-world="promises">💜 Dinosaur of Promises' World</button>
      </div>
    </section>

    <!-- WORLD -->
    <section id="world" class="world" hidden aria-label="Dinosaur world">
      <div id="worldSticky" class="world__sticky">
        <div id="worldBg" class="world__bg"></div>
        <div class="world__shade"></div>
        <div class="world__mist" aria-hidden="true"></div>
        <button class="round-back round-back--world" data-back="explore" aria-label="Go back to dinosaur choices">←</button>
        <div id="worldTitle" class="world__title"></div>
      </div>

      <div id="storyTrack" class="story-track" aria-label="Story messages">
        <article class="scroll-card" data-scroll-card>
          <span class="scroll-card__crest" aria-hidden="true">♥</span>
          <p id="message1"></p>
        </article>
        <article class="scroll-card" data-scroll-card>
          <span class="scroll-card__crest" aria-hidden="true">♥</span>
          <p id="message2"></p>
        </article>
        <article class="scroll-card scroll-card--final" data-scroll-card>
          <span class="scroll-card__crest" aria-hidden="true">♥</span>
          <p id="message3"></p>
        </article>
      </div>

      <button id="chooseAnother" class="choose-another">Choose another dinosaur <span>›</span></button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
